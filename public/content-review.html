<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elijah Content Review | DentalCancun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0e;
    --surface: #16151a;
    --surface-2: #1e1d23;
    --surface-3: #28272e;
    --border: #2a2930;
    --border-hover: #3d3c44;
    --text: #e8e6ed;
    --text-dim: #8b8994;
    --text-muted: #5c5a64;
    --accent: #c4f04d;
    --accent-dim: #a5cc3a;
    --approve: #4dcf8b;
    --approve-bg: rgba(77,207,139,0.08);
    --approve-border: rgba(77,207,139,0.25);
    --deny: #f06c5d;
    --deny-bg: rgba(240,108,93,0.08);
    --deny-border: rgba(240,108,93,0.25);
    --pending-bg: rgba(196,240,77,0.06);
    --pending-border: rgba(196,240,77,0.15);
    --radius: 10px;
    --radius-lg: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    z-index: 9999;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(12,11,14,0.85);
    backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
  }

  .header-inner {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-style: italic;
    color: var(--accent);
    letter-spacing: -0.02em;
  }

  .header-divider {
    width: 1px;
    height: 24px;
    background: var(--border);
  }

  .header-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface);
    transition: all 0.2s;
  }

  .stat-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .stat-pill.approved .dot { background: var(--approve); box-shadow: 0 0 8px rgba(77,207,139,0.4); }
  .stat-pill.denied .dot { background: var(--deny); box-shadow: 0 0 8px rgba(240,108,93,0.4); }
  .stat-pill.pending .dot { background: var(--accent); box-shadow: 0 0 8px rgba(196,240,77,0.3); }

  .export-btn {
    padding: 8px 20px;
    border-radius: 100px;
    border: none;
    background: var(--accent);
    color: var(--bg);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }

  .export-btn:hover { background: #d4ff5a; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(196,240,77,0.25); }

  .filter-bar {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px 40px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-btn {
    padding: 7px 18px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .filter-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .filter-separator {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 6px;
  }

  .main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 40px 80px;
  }

  .section { margin-bottom: 48px; }

  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .section-title {
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.02em;
  }

  .section-count {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }

  .card:hover {
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }

  .card.approved { border-color: var(--approve-border); background: var(--approve-bg); }
  .card.denied { border-color: var(--deny-border); background: var(--deny-bg); opacity: 0.6; }
  .card.denied:hover { opacity: 1; }

  .card-status {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 10;
    padding: 4px 12px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    backdrop-filter: blur(8px);
  }

  .card.approved .card-status { background: rgba(77,207,139,0.2); color: var(--approve); border: 1px solid var(--approve-border); }
  .card.denied .card-status { background: rgba(240,108,93,0.2); color: var(--deny); border: 1px solid var(--deny-border); }

  .card-preview {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
  }

  .card-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .card:hover .card-preview img { transform: scale(1.04); }

  .card-preview .play-icon {
    position: absolute;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.3s;
  }

  .card:hover .card-preview .play-icon { background: rgba(0,0,0,0.8); transform: scale(1.08); }

  .play-icon svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }

  .card-preview .type-badge {
    position: absolute;
    bottom: 10px;
    left: 10px;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    color: rgba(255,255,255,0.8);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .card-body { padding: 14px 16px; }

  .card-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
  }

  .card-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .card-actions { display: flex; gap: 8px; }

  .card-comment {
    margin-top: 10px;
    position: relative;
  }

  .card-comment textarea {
    width: 100%;
    min-height: 36px;
    max-height: 120px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    line-height: 1.4;
    resize: vertical;
    transition: border-color 0.2s;
    outline: none;
  }

  .card-comment textarea::placeholder { color: var(--text-muted); }
  .card-comment textarea:focus { border-color: var(--accent); }

  .card-comment .comment-saved {
    position: absolute;
    right: 8px;
    bottom: 8px;
    font-size: 10px;
    color: var(--accent-dim);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .card-comment .comment-saved.visible { opacity: 1; }

  .btn-approve, .btn-deny {
    flex: 1;
    padding: 8px 0;
    border-radius: 8px;
    border: 1px solid;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .btn-approve {
    background: transparent;
    border-color: var(--approve-border);
    color: var(--approve);
  }

  .btn-approve:hover { background: var(--approve-bg); border-color: var(--approve); }
  .card.approved .btn-approve { background: var(--approve); color: var(--bg); border-color: var(--approve); }

  .btn-deny {
    background: transparent;
    border-color: var(--deny-border);
    color: var(--deny);
  }

  .btn-deny:hover { background: var(--deny-bg); border-color: var(--deny); }
  .card.denied .btn-deny { background: var(--deny); color: white; border-color: var(--deny); }

  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.92);
    backdrop-filter: blur(20px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .lightbox.open { display: flex; }

  .lightbox-content {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: var(--radius-lg);
    overflow: hidden;
    position: relative;
  }

  .lightbox-content img, .lightbox-content iframe {
    max-width: 90vw;
    max-height: 80vh;
    object-fit: contain;
    display: block;
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    transition: all 0.2s;
  }

  .lightbox-close:hover { background: rgba(255,255,255,0.15); }

  .lightbox-info {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-radius: var(--radius);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .lightbox-name { font-size: 14px; font-weight: 500; }

  .lightbox-actions { display: flex; gap: 8px; }

  .lightbox-actions button {
    padding: 8px 20px;
    border-radius: 100px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: all 0.2s;
  }

  .lightbox-approve { background: var(--approve); color: var(--bg); border: none; }
  .lightbox-approve:hover { box-shadow: 0 4px 16px rgba(77,207,139,0.3); }
  .lightbox-deny { background: transparent; color: var(--deny); border: 1px solid var(--deny-border); }
  .lightbox-deny:hover { background: var(--deny-bg); }

  .bulk-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    border-radius: 100px;
    background: var(--surface-2);
    border: 1px solid var(--border-hover);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    backdrop-filter: blur(16px);
  }

  .bulk-bar .bulk-label { font-size: 13px; color: var(--text-dim); font-weight: 500; }

  .bulk-bar button {
    padding: 8px 20px;
    border-radius: 100px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .bulk-approve-all { background: var(--approve); color: var(--bg); }
  .bulk-approve-all:hover { box-shadow: 0 4px 16px rgba(77,207,139,0.3); }
  .bulk-deny-all { background: var(--deny); color: white; }
  .bulk-reset { background: var(--surface-3); color: var(--text-dim); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card { animation: fadeIn 0.4s ease-out both; }

  @media (max-width: 768px) {
    .header { padding: 0 20px; }
    .filter-bar, .main { padding-left: 20px; padding-right: 20px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .header-title { display: none; }
    .bulk-bar { left: 20px; right: 20px; transform: none; justify-content: center; }
  }
</style>
</head>

<header class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="logo">DentalCancun</div>
      <div class="header-divider"></div>
      <div class="header-title">Elijah Content Review</div>
    </div>
    <div class="header-right">
      <div class="stat-pill approved"><span class="dot"></span><span id="stat-approved">0</span> Approved</div>
      <div class="stat-pill denied"><span class="dot"></span><span id="stat-denied">0</span> Denied</div>
      <div class="stat-pill pending"><span class="dot"></span><span id="stat-pending">0</span> Pending</div>
      <button class="export-btn" onclick="exportDecisions()">Export Decisions</button>
    </div>
  </div>
</header>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All Assets</button>
  <button class="filter-btn" data-filter="image">Images</button>
  <button class="filter-btn" data-filter="video">Videos</button>
  <div class="filter-separator"></div>
  <button class="filter-btn" data-filter="pending">Pending</button>
  <button class="filter-btn" data-filter="approved">Approved</button>
  <button class="filter-btn" data-filter="denied">Denied</button>
</div>

<main class="main" id="main"></main>

<div class="bulk-bar">
  <span class="bulk-label">Bulk actions:</span>
  <button class="bulk-approve-all" onclick="bulkAction('approved')">Approve All Visible</button>
  <button class="bulk-deny-all" onclick="bulkAction('denied')">Deny All Visible</button>
  <button class="bulk-reset" onclick="bulkAction(null)">Reset Visible</button>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <div class="lightbox-content" id="lightbox-content"></div>
  <div class="lightbox-info">
    <span class="lightbox-name" id="lightbox-name"></span>
    <div class="lightbox-actions">
      <button class="lightbox-approve" onclick="lightboxAction('approved')">Approve</button>
      <button class="lightbox-deny" onclick="lightboxAction('denied')">Deny</button>
    </div>
  </div>
</div>

const decisions = {};
const comments = {};
let currentFilter = 'all';
let lightboxAssetId = null;
var commentTimers = {};

function thumbUrl(id) {
  return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w600';
}

function previewUrl(id) {
  return 'https://drive.google.com/file/d/' + id + '/preview';
}

function openUrl(id) {
  return 'https://drive.google.com/file/d/' + id + '/view';
}

function getSections() {
  const order = [];
  const map = {};
  ASSETS.forEach(function(a) {
    if (!map[a.section]) { map[a.section] = []; order.push(a.section); }
    map[a.section].push(a);
  });
  return order.map(function(s) { return { title: s, assets: map[s] }; });
}

function matchFilter(asset) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'image' || currentFilter === 'video') return asset.type === currentFilter;
  var d = decisions[asset.id];
  if (currentFilter === 'pending') return !d;
  return d === currentFilter;
}

function escapeAttr(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.textContent.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function render() {
  var main = document.getElementById('main');
  var sections = getSections();

  // Clear existing content
  while (main.firstChild) main.removeChild(main.firstChild);

  sections.forEach(function(sec) {
    var visible = sec.assets.filter(matchFilter);
    if (visible.length === 0) return;

    var sectionEl = document.createElement('div');
    sectionEl.className = 'section';

    var headerEl = document.createElement('div');
    headerEl.className = 'section-header';

    var titleEl = document.createElement('h2');
    titleEl.className = 'section-title';
    titleEl.textContent = sec.title;
    headerEl.appendChild(titleEl);

    var countEl = document.createElement('span');
    countEl.className = 'section-count';
    countEl.textContent = visible.length + ' asset' + (visible.length !== 1 ? 's' : '');
    headerEl.appendChild(countEl);

    sectionEl.appendChild(headerEl);

    var gridEl = document.createElement('div');
    gridEl.className = 'grid';

    visible.forEach(function(a, i) {
      var status = decisions[a.id] || '';
      var card = document.createElement('div');
      card.className = 'card' + (status ? ' ' + status : '');
      card.style.setProperty('--i', i);
      card.setAttribute('data-id', a.id);

      if (status) {
        var statusBadge = document.createElement('div');
        statusBadge.className = 'card-status';
        statusBadge.textContent = status === 'approved' ? 'Approved' : 'Denied';
        card.appendChild(statusBadge);
      }

      var preview = document.createElement('div');
      preview.className = 'card-preview';
      preview.addEventListener('click', (function(assetId) {
        return function() { openLightbox(assetId); };
      })(a.id));

      var img = document.createElement('img');
      img.src = thumbUrl(a.id);
      img.alt = a.name;
      img.loading = 'lazy';
      img.addEventListener('error', function() { this.style.display = 'none'; });
      preview.appendChild(img);

      if (a.type === 'video') {
        var playDiv = document.createElement('div');
        playDiv.className = 'play-icon';
        var playSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        playSvg.setAttribute('viewBox', '0 0 24 24');
        var poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', '8,5 20,12 8,19');
        playSvg.appendChild(poly);
        playDiv.appendChild(playSvg);
        preview.appendChild(playDiv);
      }

      var badge = document.createElement('div');
      badge.className = 'type-badge';
      badge.textContent = a.ext.toUpperCase() + ' \u00B7 ' + a.size;
      preview.appendChild(badge);

      card.appendChild(preview);

      var body = document.createElement('div');
      body.className = 'card-body';

      var nameEl = document.createElement('div');
      nameEl.className = 'card-name';
      nameEl.title = a.name;
      nameEl.textContent = a.name;
      body.appendChild(nameEl);

      var meta = document.createElement('div');
      meta.className = 'card-meta';
      var typeSpan = document.createElement('span');
      typeSpan.textContent = a.type === 'video' ? 'Video' : 'Image';
      meta.appendChild(typeSpan);
      var dotSpan = document.createElement('span');
      dotSpan.textContent = '\u00B7';
      meta.appendChild(dotSpan);
      var link = document.createElement('a');
      link.href = openUrl(a.id);
      link.target = '_blank';
      link.style.cssText = 'color:var(--accent);text-decoration:none;font-size:12px';
      link.textContent = 'Open in Drive';
      meta.appendChild(link);
      body.appendChild(meta);

      var actions = document.createElement('div');
      actions.className = 'card-actions';

      var approveBtn = document.createElement('button');
      approveBtn.className = 'btn-approve';
      approveBtn.textContent = 'Approve';
      approveBtn.addEventListener('click', (function(assetId) {
        return function() { setDecision(assetId, 'approved'); };
      })(a.id));
      actions.appendChild(approveBtn);

      var denyBtn = document.createElement('button');
      denyBtn.className = 'btn-deny';
      denyBtn.textContent = 'Deny';
      denyBtn.addEventListener('click', (function(assetId) {
        return function() { setDecision(assetId, 'denied'); };
      })(a.id));
      actions.appendChild(denyBtn);

      body.appendChild(actions);

      var commentWrap = document.createElement('div');
      commentWrap.className = 'card-comment';

      var textarea = document.createElement('textarea');
      textarea.placeholder = 'Add a note\u2026';
      textarea.value = comments[a.id] || '';
      textarea.rows = 1;
      textarea.addEventListener('input', (function(assetId, wrap) {
        return function(e) {
          comments[assetId] = e.target.value;
          clearTimeout(commentTimers[assetId]);
          commentTimers[assetId] = setTimeout(function() {
            saveState();
            var badge = wrap.querySelector('.comment-saved');
            if (badge) {
              badge.classList.add('visible');
              setTimeout(function() { badge.classList.remove('visible'); }, 1200);
            }
          }, 500);
        };
      })(a.id, commentWrap));
      // Prevent re-render from stealing focus — save on blur instead
      textarea.addEventListener('blur', function() { saveState(); });
      commentWrap.appendChild(textarea);

      var savedBadge = document.createElement('span');
      savedBadge.className = 'comment-saved';
      savedBadge.textContent = 'Saved';
      commentWrap.appendChild(savedBadge);

      body.appendChild(commentWrap);

      card.appendChild(body);
      gridEl.appendChild(card);
    });

    sectionEl.appendChild(gridEl);
    main.appendChild(sectionEl);
  });

  updateStats();
}

function setDecision(id, status) {
  if (decisions[id] === status) {
    delete decisions[id];
  } else {
    decisions[id] = status;
  }
  saveState();
  render();
}

function updateStats() {
  var approved = 0, denied = 0, pending = 0;
  ASSETS.forEach(function(a) {
    if (decisions[a.id] === 'approved') approved++;
    else if (decisions[a.id] === 'denied') denied++;
    else pending++;
  });
  document.getElementById('stat-approved').textContent = approved;
  document.getElementById('stat-denied').textContent = denied;
  document.getElementById('stat-pending').textContent = pending;
}

function bulkAction(status) {
  var visibleCards = document.querySelectorAll('.card[data-id]');
  visibleCards.forEach(function(c) {
    var id = c.getAttribute('data-id');
    if (status === null) delete decisions[id];
    else decisions[id] = status;
  });
  saveState();
  render();
}

function openLightbox(id) {
  lightboxAssetId = id;
  var asset = ASSETS.find(function(a) { return a.id === id; });
  var lb = document.getElementById('lightbox');
  var content = document.getElementById('lightbox-content');
  var nameEl = document.getElementById('lightbox-name');

  nameEl.textContent = asset.name;

  while (content.firstChild) content.removeChild(content.firstChild);

  if (asset.type === 'video') {
    var iframe = document.createElement('iframe');
    iframe.src = previewUrl(id);
    iframe.width = '854';
    iframe.height = '480';
    iframe.style.cssText = 'border:none;border-radius:12px;max-width:90vw;max-height:80vh';
    iframe.setAttribute('allow', 'autoplay');
    iframe.allowFullscreen = true;
    content.appendChild(iframe);
  } else {
    var img = document.createElement('img');
    img.src = thumbUrl(id);
    img.alt = asset.name;
    img.style.borderRadius = '12px';
    content.appendChild(img);
  }

  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  var lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  var content = document.getElementById('lightbox-content');
  while (content.firstChild) content.removeChild(content.firstChild);
  document.body.style.overflow = '';
  lightboxAssetId = null;
}

function lightboxAction(status) {
  if (lightboxAssetId) {
    setDecision(lightboxAssetId, status);
  }
}

document.getElementById('lightbox').addEventListener('click', function(e) {
  if (e.target.id === 'lightbox') closeLightbox();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = btn.getAttribute('data-filter');
    render();
  });
});

function saveState() {
  try {
    localStorage.setItem('dentalcancun-review', JSON.stringify(decisions));
    localStorage.setItem('dentalcancun-comments', JSON.stringify(comments));
  } catch(e) {}
}

function loadState() {
  try {
    var saved = localStorage.getItem('dentalcancun-review');
    if (saved) {
      var parsed = JSON.parse(saved);
      Object.keys(parsed).forEach(function(k) { decisions[k] = parsed[k]; });
    }
    var savedComments = localStorage.getItem('dentalcancun-comments');
    if (savedComments) {
      var parsedComments = JSON.parse(savedComments);
      Object.keys(parsedComments).forEach(function(k) { comments[k] = parsedComments[k]; });
    }
  } catch(e) {}
}

function exportDecisions() {
  var approved = [], denied = [], pending = [];
  ASSETS.forEach(function(a) {
    var d = decisions[a.id];
    var entry = '[' + a.section + '] ' + a.name + ' (' + a.size + ')';
    if (comments[a.id]) entry += '\n    Note: ' + comments[a.id];
    if (d === 'approved') approved.push(entry);
    else if (d === 'denied') denied.push(entry);
    else pending.push(entry);
  });

  var text = 'DENTALCANCUN CONTENT REVIEW - ' + new Date().toLocaleDateString() + '\n';
  text += '==================================================\n\n';
  text += 'APPROVED (' + approved.length + '):\n' + (approved.map(function(a) { return '  + ' + a; }).join('\n') || '  (none)') + '\n\n';
  text += 'DENIED (' + denied.length + '):\n' + (denied.map(function(a) { return '  - ' + a; }).join('\n') || '  (none)') + '\n\n';
  text += 'PENDING (' + pending.length + '):\n' + (pending.map(function(a) { return '  ? ' + a; }).join('\n') || '  (none)') + '\n';

  var blob = new Blob([text], { type: 'text/plain' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'content-review-' + new Date().toISOString().split('T')[0] + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

loadState();
render();
</script>
</body>
</html>
